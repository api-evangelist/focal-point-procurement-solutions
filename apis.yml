name: Focal Point Procurement Solutions
description: >-
  Focal Point is an AI-powered procurement orchestration platform for enterprise procurement teams.
  Founded in 2020 and headquartered in Atlanta, Georgia, the SaaS platform sits on top of a company's
  existing S2P and ERP systems to centralize procurement data, intake, and workflows across six core
  modules: Request Intake Management, Procurement Activity Management, Sourcing Event Management,
  Supplier Relationship Management, Third-Party Risk Management, and Contract Lifecycle Management.
  It connects existing systems and data via API integrations, automates tactical no-code workflows,
  and provides total spend visibility, intelligent intake, and smart routing so procurement teams can
  focus on strategic work. Focal Point does not currently publish a public developer API, OpenAPI
  definition, or developer portal; integrations are delivered through the platform. This profile was
  surfaced as a Techstars portfolio company and added to the API Evangelist network.
